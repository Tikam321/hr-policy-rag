[project]
name = "hr-policy-rag"
version = "0.1.0"
description = "Production-grade HR Policy RAG system with synthetic data, eval harness, and cited answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Config & schemas
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jsonschema>=4.22.0",

    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "qdrant-client>=1.9.0",

    # RAG core
    "openai>=1.35.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",

    # Worker
    "celery[redis]>=5.4.0",

    # Logging
    "structlog>=24.2.0",

    # PDF generation (synthetic data)
    "weasyprint>=62.0",
    "jinja2>=3.1.4",

    # Eval
    "ragas>=0.1.9",
    "datasets>=2.20.0",

    # Utils
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
web = [
    "streamlit>=1.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "apps", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
